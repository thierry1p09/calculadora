<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <h1>Calculadora</h1>
        <p class="descricao">Faça suas contas facilmente</p>

        <input id="n1" type="number" step="any"
               placeholder="Primeiro número">

        <input id="n2" type="number" step="any"
               placeholder="Segundo número">

        <div class="botoes">
            <button class="somar" onclick="somar()">+</button>
            <button class="subtrair" onclick="subtrair()">−</button>
        </div>

        <p id="resultado">Resultado: —</p>

        <p class="rodape">Calculadora • HTML, CSS e JavaScript</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
